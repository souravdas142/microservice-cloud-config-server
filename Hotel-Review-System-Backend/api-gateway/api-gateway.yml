server:
  port: ${SERVER_PORT:8084}
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/users/**
        - id: hotel-service
          uri: lb://hotel-service
          predicates:
            - Path=/hotels/**,/staffs/**
        - id: rating-service
          uri: lb://rating-service
          predicates:
            - Path=/ratings/**
